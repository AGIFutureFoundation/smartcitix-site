  <text x="30" y="472" font-family="system-ui, sans-serif" font-size="11" fill="#5b6b7d">Source: SmartCiti.X learner platform, scenarios/scenarios.json (6 scenarios, 5 steps each = 30 steps), verified by scenarios/verify.mjs. 11 registry strands; inspection and leadership have no scenario yet.</text>
